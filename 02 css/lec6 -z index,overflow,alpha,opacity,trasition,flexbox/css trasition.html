<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: aqua;

            transition-duration: 1s;
            transition-delay: 1s;
            transition-timing-function: ease;
        }

        div:hover{
            background-color: black;
            border-radius: 50%;
            color: rgb(218, 128, 11);
            font-size: 24px;
            padding-left: 15px;
            padding-top: 50px;
        }
        div:hover::after{
            content: "Priyanak";
        }

        section{
            height: 200px;
            width: 200px;
            background-color: blue;
            margin-top:  0 auto;

            transition: all 5s ease 0.2s;
            
        }

        section:hover{
            margin-top: 200px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div></div>

    <section></section>
</body>
</html>

<body style="font-family: cursive;">
    <h1>Async function</h1>
    <p>- An async function is a function that always returns a Promise</p>

    <h1>await keyword</h1>
    <p>- The await keyword is used within async function to pause the execution untill a Promise is settled (resolved or
        rejected).</p>

        <script>
            // async function hello(){
            //     return "hello world!!!!"
            //     //return new Promise(() => {})
            // }
            // hello()
            // .then((res) => {
            //     console.log("promise is resolved",res)
            // })
            // .catch((err) => {
            //     console.log("it is reject", err)
            // })

            function wait(){
                return new Promise((resolve, reject) =>{
                    setTimeout(() => {
                        console.log("wait complete")
                        resolve() //reject()
                    }, 3000)
                })
            }

            //console.log("before wait")
                const awaitDemo = async() => {
                    try{
                        console.log("before wait")
                        await wait() //wait()
                        await wait() //wait()
                        await wait() //wait()
                        console.log("after wait");
                    }
                    catch(error)
                    {
                        console.log("some error occures",error)
                    }
        //  await wait() //wait()
        //  await wait() //wait()
        //  await wait() //wait()
        //  console.log("after wait");
         
                }
                awaitDemo()
                //wait()
                //await wait()
            // console.log("after wait")
        </script>

<body style="font-family: cursive;">
    <h2>Using Promise to Avoid callback hell</h2>
    <script>
        function sendEmail() {
            return new Promise((resolve, reject) => {
                const number = Math.round(Math.random()*11)

                setTimeout(() =>{
                    if(number > 5) {
                        resolve("Email is resolved.", + number)
                    }
                    else {
                        reject("Email is rejected", + number)
                    }
                }, 0)
                
            })
        }
        sendEmail()
        .then((res) => {
            console.log("resolved", res)
           
            sendEmail()
                 .then((res) => {
            console.log("resolved again", res)
                    
            sendEmail()
              .then((res) => {
               console.log("resolved once again", res)
                    })
              .catch((err) => {
                console.log("rejected once again", err)
                 })
                    })
        .catch((err) => {
            console.log("rejected again", err)
          })
        })
        .catch((err) => {
            console.log("rejected", err)
        })
